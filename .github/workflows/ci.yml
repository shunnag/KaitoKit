name: CI

# 一時的な診断用（PR #35 の macos-26 で CompressedTarSpliceTests が signal 5 で落ちた原因を調べる）。
on:
  pull_request:

jobs:
  splice-crash:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Versions
        run: |
          sw_vers
          swift --version
          xcodebuild -version
          sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu
          df -h "$TMPDIR" .
      - name: Data slice repro matrix
        if: false
        run: |
          set +e
          swiftc -Onone Scripts/diag/data-slice-repro.swift -o /tmp/repro
          for i in $(seq 1 55); do /tmp/repro $i >/dev/null 2>&1; echo "case $i exit=$?"; done
          swiftc -O Scripts/diag/data-slice-repro.swift -o /tmp/repro-o
          for i in $(seq 1 55); do /tmp/repro-o $i >/dev/null 2>&1; echo "case $i -O exit=$?"; done
      - name: Build tests
        if: false
        run: swift build --build-tests
      - name: Run the crashing test under lldb
        if: false
        run: |
          bundle="$(find .build -name 'KaitoKitPackageTests.xctest' -maxdepth 4 | head -1)"
          echo "bundle=$bundle"
          lldb --batch \
            -o 'settings set target.process.stop-on-exec false' \
            -o run \
            -k 'thread backtrace all' \
            -k 'frame variable' \
            -k quit \
            -- "$(xcrun --find xctest)" -XCTest KaitoKitTests.CompressedTarSpliceTests "$bundle" 2>&1 | tail -400
      - name: Run the suite normally
        if: false
        run: swift test --skip-build --filter 'CompressedTarSplice' 2>&1 | tail -80
      - name: Crash reports
        if: always()
        run: |
          ls -la ~/Library/Logs/DiagnosticReports/ || true
          for f in ~/Library/Logs/DiagnosticReports/xctest*; do echo "== $f"; head -c 60000 "$f"; done || true

  # GyoshukuKit 0.6.0 の候補（release/0.6.0）を、この KaitoKit を隣に置いた path 依存で macOS 26 で試験する。
  gyoshukukit-on-macos26:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Clone GyoshukuKit next to KaitoKit
        run: git clone --depth 1 --branch release/0.6.0 https://github.com/shunnag/GyoshukuKit.git ../GyoshukuKit
      - name: Install oracles
        run: brew install sevenzip xz
      - name: Versions
        run: |
          sw_vers
          swift --version
          git -C ../GyoshukuKit log --oneline -1
      - name: Build GyoshukuKit and its tests
        working-directory: ../GyoshukuKit
        run: swift build --build-tests
      - name: Test GyoshukuKit
        working-directory: ../GyoshukuKit
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | tee /tmp/gk.log | grep -E "error:|failed|Executed [0-9]+ tests|signal|Fatal|exited with"
      - name: Summary
        if: always()
        run: |
          grep -E "Test Case .* started" /tmp/gk.log | tail -3 || true
          grep -E "with [0-9]+ tests? skipped|exited with" /tmp/gk.log | tail -5 || true

  # KaitoFinder 0.4.0 の候補を macOS 26（Xcode 26.6）で build し、全件を試験する（Foundation の差の検出用）。
  kaitofinder-on-macos26:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Clone siblings
        run: |
          git clone --depth 1 --branch release/0.6.0 https://github.com/shunnag/GyoshukuKit.git ../GyoshukuKit
          git clone --depth 1 --branch release/0.4.0 https://github.com/shunnag/KaitoFinder.git ../KaitoFinder
      - name: Install tools
        run: brew install sevenzip xz
      - name: Versions
        run: |
          sw_vers
          xcodebuild -version
          git -C ../GyoshukuKit log --oneline -1
          git -C ../KaitoFinder log --oneline -1
      - name: Build for testing
        working-directory: ../KaitoFinder
        run: |
          set -o pipefail
          xcodebuild -project KaitoFinder.xcodeproj -scheme KaitoFinder -destination 'platform=macOS' \
            -derivedDataPath /tmp/kf-dd build-for-testing 2>&1 | tee /tmp/kf-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | head -80
      - name: Test
        working-directory: ../KaitoFinder
        run: |
          set -o pipefail
          xcodebuild -project KaitoFinder.xcodeproj -scheme KaitoFinder -destination 'platform=macOS' \
            -derivedDataPath /tmp/kf-dd test-without-building 2>&1 | tee /tmp/kf-test.log | grep -E "Test Case .* failed|Executed [0-9]+ tests|crashed|signal|Restarting after unexpected exit" | head -200
      - name: Summary
        if: always()
        run: |
          grep -E "error:" /tmp/kf-build.log | sort | uniq | head -60 || true
          grep -E "Executed [0-9]+ tests" /tmp/kf-test.log | tail -2 || true
          grep -E "Test Case .* failed" /tmp/kf-test.log | sed -E 's/.*\[KaitoFinderTests\.([A-Za-z]+) ([A-Za-z0-9_]+)\].*/\1 \2/' | sort -u | head -80 || true
          grep -E -B3 -A25 "crashed|Restarting after unexpected exit" /tmp/kf-test.log | head -200 || true
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -20 || true
      - name: Crash reports
        if: always()
        run: |
          for f in ~/Library/Logs/DiagnosticReports/KaitoFinder* ~/Library/Logs/DiagnosticReports/xctest*; do [ -f "$f" ] && { echo "== $f"; head -c 40000 "$f"; }; done; true
