name: CI

# build は Xcode 27 / Swift 6.4 のみ。製品の実行環境は macOS 26 以上を維持する。
# Swift 6.3.3 の -O は TaskLocal<function?> の withValue を誤コンパイルする
# （valueType metadata が nil、EXC_BAD_ACCESS。GyoshukuKit の 2026-10-08 probe で確認）。
# macos-26 / macos-26-intel は Xcode 27 で build した test をコンパイルせず実行する。
# Intel の利用者は少数のため、PR は arm64 だけ検査し、Intel の退行は merge 後の検出を許容する。
# Intel の 2 shard は main push・schedule・workflow_dispatch で必ず実行する。
# Xcode 27 job は自前の Apple Silicon へ送る。fork PR だけは hosted runner で実行する。
# push は main だけにする。PR ブランチへの push でも起動すると
# pull_request と合わせて同じ commit に job が二重に走る(2026-09-11 PR #5 で確認)。
# tag の push では起動しない。tag は PR で検査済みの main の merge commit に付ける。
# tag と main の二重起動は macos-26-intel の待ちを 30 分超に伸ばした(2026-10-11/12)。
# 文書だけの変更では起動しない。ただしテストが読む文書は除外しない
# (Tests/KaitoKitTests/Documentation/DocumentationConsistencyTests.swift)。
# 一覧は Scripts/ci/check_paths_filter.py が plan job で検査する。push と pull_request で同じ一覧にする。
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!Documentation/**'
      - 'Documentation/formats.md'
      - 'Documentation/verification/README.md'
      - 'Documentation/verification/2026-09-19-release-review.md'
      - 'Documentation/verification/2026-09-22-dmg.md'
      - 'Documentation/verification/2026-09-22-hfsplus-decmpfs.md'
      - 'Documentation/verification/2026-09-22-release-review-0.8.1.md'
      - 'Documentation/verification/2026-09-22-release-review-0.9.0.md'
      - 'Documentation/verification/2026-09-22-rpm-stripped-payload.md'
      - 'Documentation/verification/2026-09-22-sevenzip-deflate64.md'
      - 'Documentation/verification/2026-09-22-small-method-gaps.md'
  pull_request:
    paths:
      - '**'
      - '!Documentation/**'
      - 'Documentation/formats.md'
      - 'Documentation/verification/README.md'
      - 'Documentation/verification/2026-09-19-release-review.md'
      - 'Documentation/verification/2026-09-22-dmg.md'
      - 'Documentation/verification/2026-09-22-hfsplus-decmpfs.md'
      - 'Documentation/verification/2026-09-22-release-review-0.8.1.md'
      - 'Documentation/verification/2026-09-22-release-review-0.9.0.md'
      - 'Documentation/verification/2026-09-22-rpm-stripped-payload.md'
      - 'Documentation/verification/2026-09-22-sevenzip-deflate64.md'
      - 'Documentation/verification/2026-09-22-small-method-gaps.md'
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * *"

# PR では新しい push が古い run を取り消す。main / workflow_dispatch / schedule の run は取り消さない。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  # PR 対象の全 CI が通った tree と同じ main の push は重複検査だけ省く。曖昧なら全部走らせる。
  # PR に無い Intel と、その bundle を作る build-for-macos-26 は検査済み tree でも省かない。
  plan:
    runs-on: ubuntu-latest
    # hang は 6 時間待たず、通常の所要時間の約2倍で失敗させる。
    timeout-minutes: 5
    outputs:
      full: ${{ steps.decide.outputs.full }}
      runtime-matrix: ${{ steps.decide.outputs.runtime-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check CI tooling and paths filter
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/ci/test_shards.py Scripts/ci/check_paths_filter.py
          python3 Scripts/ci/test_shards.py --self-test
          python3 Scripts/ci/check_paths_filter.py --self-test
          python3 Scripts/ci/check_paths_filter.py
      - name: Look up a successful PR for the same tree
        id: lookup
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          skip=false
          reason="event=$EVENT: 全 CI"
          lookup() {
            if [ "$EVENT" != push ] || [ "$REF" != refs/heads/main ]; then
              return
            fi
            reason="checkout の commit を確認できないため全 CI"
            local checked_sha tree pulls pr head runs id url count
            checked_sha="$(git rev-parse HEAD)" || return
            [ "$checked_sha" = "$SHA" ] || return
            tree="$(git rev-parse 'HEAD^{tree}')" || return
            reason="PR の取得に失敗したため全 CI"
            pulls="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$SHA\") | {number, head: .head.sha}]")" || return
            reason="PR が一意でないため全 CI"
            pr="$(jq -er 'if length == 1 then .[0].number else empty end | select(type == "number" and . > 0 and . == floor)' <<< "$pulls")" || return
            head="$(jq -er '.[0].head | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$pulls")" || return
            reason="PR run の取得に失敗したため全 CI"
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head&status=success&per_page=100" --jq '.workflow_runs[] | "\(.id) \(.html_url)"')" || return
            reason="同じ tree の検査済み記録がないため全 CI"
            while read -r id url; do
              [ -n "$id" ] || continue
              if [[ ! "$id" =~ ^[0-9]+$ ]] || [[ ! "$url" =~ ^https://github\.com/ ]]; then
                reason="PR run の応答が不正なため全 CI"
                return
              fi
              reason="検査済み記録の取得に失敗したため全 CI"
              count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?name=tested-tree-$tree" --jq '[.artifacts[] | select(.expired | not)] | length')" || return
              if [[ ! "$count" =~ ^[0-9]+$ ]]; then
                reason="検査済み記録の応答が不正なため全 CI"
                return
              fi
              if [ "$count" -ge 1 ]; then
                reason="tree $tree は PR #$pr の $url で PR 対象の CI 済み。重複検査だけ省き、Intel の build と実行・coverage 検査は維持する。"
                skip=true
                return
              fi
              reason="同じ tree の検査済み記録がないため全 CI"
            done <<< "$runs"
          }
          lookup || true
          printf 'skip=%s\n' "$skip" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
      # lookup が literal true を返したときだけ省く。失敗・出力欠落では全 CI にする。
      - name: Decide whether to run the full CI
        id: decide
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          SKIP: ${{ steps.lookup.outputs.skip }}
          LOOKUP_OUTCOME: ${{ steps.lookup.outcome }}
        run: |
          set -euo pipefail
          full=true
          if [ "$LOOKUP_OUTCOME" = success ] && [ "$SKIP" = true ]; then
            full=false
          elif [ "$LOOKUP_OUTCOME" != success ]; then
            printf 'gate の確認に失敗したため全 CI\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'full=%s\n' "$full" >> "$GITHUB_OUTPUT"
          # PR は arm64、検査済み main は Intel だけ、それ以外は両 arch を実行する。
          matrix="$(jq -cn --arg full "$full" --arg event "$EVENT" '{include: [
            ({os: "macos-26", shard: "all", shards: "all", timeout: 75} | select($full == "true")),
            ({os: "macos-26-intel", shard: "1", shards: "2", timeout: 95},
             {os: "macos-26-intel", shard: "2", shards: "2", timeout: 95} | select($event != "pull_request"))
          ]}')"
          printf 'runtime-matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["xcode-27"]' || '["self-hosted", "shunnag-arm64"]') }}
    # hang は 6 時間待たず、通常の所要時間の約2倍で失敗させる。
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install differential-test oracles
        run: |
          set -euo pipefail
          missing=()
          for tool in 7zz xz brotli zstd; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
              printf 'error: self-hosted runner に必要なツールがありません: %s\n' "${missing[*]}" >&2
              exit 1
            fi
            brew install sevenzip xz brotli zstd
          fi
      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          7zz i 2>&1 | head -2 || true; for tool in xz brotli zstd; do "$tool" --version 2>&1 | head -1 || true; done
      - name: Build
        run: swift build -v
      - name: Test
        env:
          KAITO_REQUIRE_7ZZ: "1"
          KAITO_REQUIRE_XZ: "1"
          KAITO_REQUIRE_BROTLI: "1"
          KAITO_REQUIRE_ZSTD: "1"
        run: swift test
      # LHA の公開値の golden は日付を Asia/Tokyo で固定しており、UTC の runner では skip される。
      - name: Test LHA golden values in Asia/Tokyo
        env:
          TZ: Asia/Tokyo
          KAITO_REQUIRE_LHA_GOLDEN: "1"
        # golden の 2 件が実際に走ったことも出力で確かめる（名前の変更で filter に一致しなくなっても緑にしない）。
        run: |
          set -euo pipefail
          swift test --skip-build --filter 'LHARawLayout|LHAPublicValueGolden' 2>&1 | tee "$RUNNER_TEMP/lha-golden.log"
          grep -q 'LHA-GOLDEN Step0=31 TZ=Asia/Tokyo' "$RUNNER_TEMP/lha-golden.log"
          grep -q 'LHA-GOLDEN existing=3 TZ=Asia/Tokyo' "$RUNNER_TEMP/lha-golden.log"
          grep -Eq "Executed [1-9][0-9]* tests?, with 0 failures" "$RUNNER_TEMP/lha-golden.log"

  build-for-macos-26:
    needs: plan
    # PR の検査済み tree でも、main の Intel 実行に必要な artifact は今回の run で作る。
    if: needs.plan.outputs.full == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["xcode-27"]' || '["self-hosted", "shunnag-arm64"]') }}
    # hang は 6 時間待たず、通常の所要時間の約2倍で失敗させる。
    timeout-minutes: 10
    steps:
      # build 時の checkout path を artifact に記録し、hosted 実行時に別名で復元する。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build universal debug tests
        run: swift build --build-tests --arch arm64 --arch x86_64
      - name: Package runtime tests and Xcode 27 dependencies
        run: |
          set -euo pipefail
          export DEBUG_BIN PACKAGE_STAGE
          DEBUG_BIN="$(swift build --show-bin-path --build-tests --arch arm64 --arch x86_64)"
          PACKAGE_STAGE="$RUNNER_TEMP/macos-26-tests"
          rm -rf "$PACKAGE_STAGE"
          python3 <<'PYTHON'
          import os
          import plistlib
          import re
          import shutil
          import subprocess
          from collections import deque
          from pathlib import Path

          root = Path.cwd().resolve()
          stage = Path(os.environ["PACKAGE_STAGE"])
          runtime = stage / ".build/ci-runtime"
          architectures = ("arm64", "x86_64")
          for directory in (runtime / "bin", runtime / "lib", runtime / "Frameworks"):
              directory.mkdir(parents=True, exist_ok=True)
          (runtime / "checkout-path.txt").write_text(str(root) + "\n")

          # xcrun と同じ Xcode を探す。自前 runner の DEVELOPER_DIR を優先する。
          developer = Path(os.environ.get("DEVELOPER_DIR") or subprocess.check_output(
              ["xcode-select", "-p"], text=True
          ).strip()).resolve()
          if developer.suffix == ".app":
              developer /= "Contents/Developer"
          macos = developer / "Platforms/MacOSX.platform/Developer"
          runner = Path(subprocess.check_output(["xcrun", "-f", "xctest"], text=True).strip()).resolve()
          shutil.copy2(runner, runtime / "bin/xctest")
          search_paths = [
              macos / "Library/Frameworks", macos / "Library/PrivateFrameworks",
              macos / "usr/lib", macos / "usr/lib/swift/macosx",
              developer / "Library/Frameworks", developer / "Library/PrivateFrameworks",
              developer.parent / "SharedFrameworks",
              developer / "Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/macosx",
          ]
          products = Path(os.environ["DEBUG_BIN"]).resolve()
          products.relative_to(root / ".build")
          roots = [runner, products / "kaito"]
          for name in ("KaitoKitTests", "KaitoKitCompatTests"):
              bundle = products / f"{name}.xctest"
              if not bundle.is_dir():
                  raise RuntimeError(f"Missing test bundle: {bundle}")
              relative = bundle.relative_to(root)
              target = stage / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copytree(bundle, target, symlinks=True)
              (runtime / f"{name}-bundle.txt").write_text(str(relative) + "\n")
              with (bundle / "Contents/Info.plist").open("rb") as info:
                  executable = plistlib.load(info)["CFBundleExecutable"]
              roots.append(bundle / "Contents/MacOS" / executable)
              print(f"Package: {relative}", flush=True)
          # CLI test は bundle の隣を探す。Xcode 27 の Products/Debug の相対配置を保つ。
          shutil.copy2(products / "kaito", stage / (products / "kaito").relative_to(root))
          # .build/debug を直接使う fixture test にも、build が作った相対 symlink を保つ。
          debug_link = root / ".build/debug"
          debug_target = os.readlink(debug_link)
          if Path(debug_target).is_absolute() or debug_link.resolve() != products:
              raise RuntimeError(f"Unexpected .build/debug symlink: {debug_target}")
          (stage / ".build/debug").symlink_to(debug_target, target_is_directory=True)
          print(f"Package: .build/debug -> {debug_target}", flush=True)

          def system_path(path):
              return str(path).startswith(("/usr/lib/", "/System/Library/", "/Library/Apple/System/Library/"))

          def expand(path, binary, executable):
              return Path(path.replace("@loader_path", str(binary.parent)).replace(
                  "@executable_path", str(executable.parent)
              )).resolve()

          resolved_rpaths = {}
          def resolve_dependency(name, binary, executable, rpaths):
              if name.startswith("@rpath/"):
                  # 同じ install name は最初の解決先を使う（platform / SharedFrameworks の重複）。
                  if name in resolved_rpaths:
                      return resolved_rpaths[name]
                  suffix = name.removeprefix("@rpath/")
                  candidates = [directory / suffix for directory in [*rpaths, *search_paths]]
                  if suffix.startswith("Testing.framework/"):
                      # SharedFrameworks の Testing は arm64-only。同名の universal な platform copy を優先する。
                      candidates.insert(0, macos / "Library/Frameworks" / suffix)
              else:
                  candidates = [expand(name, binary, executable)]
              for candidate in candidates:
                  if candidate.is_file():
                      dependency = candidate.resolve()
                      if name.startswith("@rpath/"):
                          resolved_rpaths[name] = dependency
                      return dependency
              # shared cache 内の system dylib は file として存在しない。
              if not name.startswith("@") and system_path(Path(name)):
                  return None
              raise RuntimeError(f"Cannot resolve {name} from {binary}")

          verified = set()
          def verify_universal(binary):
              if binary not in verified:
                  for architecture in architectures:
                      subprocess.run(["lipo", str(binary), "-verify_arch", architecture], check=True)
                  verified.add(binary)

          for binary in roots:
              verify_universal(binary)
          queue = deque((binary, runner, architecture, []) for binary in roots for architecture in architectures)
          visited = set()
          copied = {}
          while queue:
              binary, executable, architecture, inherited_rpaths = queue.popleft()
              binary = binary.resolve()
              if (binary, architecture) in visited or system_path(binary):
                  continue
              visited.add((binary, architecture))
              dependencies = subprocess.check_output([
                  "otool", "-arch", architecture, "-L", str(binary)
              ], text=True)
              loads = subprocess.check_output([
                  "otool", "-arch", architecture, "-l", str(binary)
              ], text=True)
              print(dependencies, end="", flush=True)
              rpaths = [expand(match.group(1), binary, executable) for match in re.finditer(
                  r"cmd LC_RPATH\n\s+cmdsize \d+\n\s+path (.*?) \(offset \d+\)", loads
              )]
              rpaths = list(dict.fromkeys([*rpaths, *inherited_rpaths]))
              weak = set(re.findall(
                  r"cmd LC_LOAD_WEAK_DYLIB\n\s+cmdsize \d+\n\s+name (.*?) \(offset \d+\)", loads
              ))
              for name in re.findall(r"^\s+(.+?) \(compatibility version", dependencies, re.MULTILINE):
                  if not name.startswith("@") and system_path(Path(name)):
                      continue
                  dependency = resolve_dependency(name, binary, executable, rpaths)
                  if dependency is None or dependency == binary or system_path(dependency):
                      continue
                  if name in weak:
                      slices = subprocess.check_output(["lipo", "-archs", str(dependency)], text=True).split()
                      missing = [arch for arch in architectures if arch not in slices]
                      if missing:
                          print(f"Skip weak dependency ({architecture}; missing {missing}): {dependency}", flush=True)
                          continue
                  # 全ての同梱依存は universal。strong dependency の slice 不足はここで失敗する。
                  verify_universal(dependency)
                  framework = next((p for p in dependency.parents if p.suffix == ".framework"), None)
                  if framework:
                      source, target = framework, runtime / "Frameworks" / framework.name
                  else:
                      source, target = dependency, runtime / "lib" / Path(name).name
                  if target in copied and copied[target] != source:
                      raise RuntimeError(f"Conflicting dependencies: {target}: {copied[target]} vs {source}")
                  if target not in copied:
                      copied[target] = source
                      if framework:
                          shutil.copytree(source, target, symlinks=True)
                      else:
                          shutil.copy2(source, target)
                      print(f"Dependency: {source} -> {target.relative_to(stage)}", flush=True)
                  queue.append((dependency, executable, architecture, rpaths))
          # source だけでなく artifact の実体にも両 arch があることを確かめる。
          for binary in roots:
              target = runtime / "bin/xctest" if binary == runner else stage / binary.relative_to(root)
              verify_universal(target)
          for target, source in copied.items():
              if source.suffix == ".framework":
                  with (source / "Resources/Info.plist").open("rb") as info:
                      executable = plistlib.load(info)["CFBundleExecutable"]
                  verify_universal(target / executable)
              else:
                  verify_universal(target)
          PYTHON
          # test の一覧は Xcode 27 の helper で、運ぶのと同じ bundle から作る。
          # macos-26 の Xcode 26 helper は Xcode 27 の bundle を load できない前提で扱う。
          helper="$(dirname "$(xcrun -f swift)")/../libexec/swift/pm/swiftpm-xctest-helper"
          test -x "$helper"
          for name in KaitoKitTests KaitoKitCompatTests; do
            "$helper" "$DEBUG_BIN/$name.xctest" "$RUNNER_TEMP/$name-tests.json"
          done
          python3 Scripts/ci/test_shards.py inventory --output "$PACKAGE_STAGE/.build/ci-runtime/test-list.txt" \
            "$RUNNER_TEMP/KaitoKitTests-tests.json" "$RUNNER_TEMP/KaitoKitCompatTests-tests.json"
          python3 Scripts/ci/test_shards.py plan-check --inventory "$PACKAGE_STAGE/.build/ci-runtime/test-list.txt"
          mkdir -p "$RUNNER_TEMP/macos-26-test-inventory"
          cp "$PACKAGE_STAGE/.build/ci-runtime/test-list.txt" "$RUNNER_TEMP/macos-26-test-inventory/"
          # tar で .build/debug・bundle 内の symlink と実行権限を保つ。object / checkout は含めない。
          tar -czf "$RUNNER_TEMP/macos-26-tests.tar.gz" -C "$PACKAGE_STAGE" .build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-26-tests
          path: ${{ runner.temp }}/macos-26-tests.tar.gz
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-26-test-inventory
          path: ${{ runner.temp }}/macos-26-test-inventory/test-list.txt
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  macos-26-runtime:
    name: macOS 26 runtime (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    # hang は 6 時間待たず、通常の所要時間の約2倍で失敗させる。
    # arm64 は約 37 分、x86_64 の各 shard は約 46.4 分(2026-10-14 時点の予測最大)。
    # Intel は 2 shard にして、定常時の macOS job を最大 4 個にする。
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # Intel は PR の matrix に含めず、検査済み main でも必ず含める。
      matrix: ${{ fromJSON(needs.plan.outputs.runtime-matrix) }}
    runs-on: ${{ matrix.os }}
    needs: [plan, build-for-macos-26]
    if: needs.plan.outputs.full == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install differential-test oracles
        run: |
          set -euo pipefail
          missing=()
          for tool in 7zz xz brotli zstd; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
              printf 'error: self-hosted runner に必要なツールがありません: %s\n' "${missing[*]}" >&2
              exit 1
            fi
            brew install sevenzip xz brotli zstd
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-26-tests
          path: ${{ runner.temp }}/macos-26-artifact
      - name: Extract test bundles
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/macos-26-artifact/macos-26-tests.tar.gz" -C "$GITHUB_WORKSPACE"
          # #filePath の絶対 path を保つ。sudo は使い捨ての hosted runtime job だけで使う。
          python3 <<'PYTHON'
          import subprocess
          from pathlib import Path

          workspace = Path.cwd().resolve()
          checkout = Path(".build/ci-runtime/checkout-path.txt").read_text().strip()
          source = Path(checkout)
          if not source.is_absolute() or source.name != workspace.name or ".." in source.parts:
              raise RuntimeError(f"Invalid build checkout path: {checkout}")
          if source.resolve() != workspace:
              if source.exists() or source.is_symlink():
                  raise RuntimeError(f"Build checkout alias already exists: {source}")
              subprocess.run(["sudo", "mkdir", "-p", str(source.parent)], check=True)
              subprocess.run(["sudo", "ln", "-s", str(workspace), str(source)], check=True)
          if source.resolve() != workspace:
              raise RuntimeError(f"Build checkout alias does not resolve to {workspace}")
          PYTHON
      - name: Run tests and LHA golden without compiling
        env:
          KAITO_REQUIRE_7ZZ: "1"
          KAITO_REQUIRE_XZ: "1"
          KAITO_REQUIRE_BROTLI: "1"
          KAITO_REQUIRE_ZSTD: "1"
          MATRIX_OS: ${{ matrix.os }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          7zz i 2>&1 | head -2 || true; for tool in xz brotli zstd; do "$tool" --version 2>&1 | head -1 || true; done
          runtime="$PWD/.build/ci-runtime"
          test -x .build/debug/kaito
          architecture="$(uname -m)"
          case "$architecture" in arm64|x86_64) ;; *) exit 1 ;; esac
          printf 'xctest architecture: %s (arch -arch で実行 slice を指定)\n' "$architecture"
          lipo "$runtime/bin/xctest" -verify_arch "$architecture"

          run_tests() {
            local label="$1" bundle="$2"
            shift 2
            local log="$RUNNER_TEMP/${label}-bundled.log"
            printf 'Runner (%s): %s\n' "$label" "$runtime/bin/xctest"
            # Xcode 26 の system xctest は Xcode 27 の bundle を load できないため、同梱 runner を使う。
            # arch / env の起動時は SIP が DYLD_* を消す。env の引数でその後に設定する。
            /usr/bin/arch -arch "$architecture" /usr/bin/env \
              DYLD_FRAMEWORK_PATH="$runtime/Frameworks" DYLD_LIBRARY_PATH="$runtime/lib" \
              "$runtime/bin/xctest" "$@" "$bundle" 2>&1 | tee "$log"
            # selector の不一致などで実行 0 件になっても成功にはしない。pipefail で実際の failure も伝える。
            grep -Eq "Executed [1-9][0-9]* tests?, with 0 failures" "$log"
          }

          plan() { python3 Scripts/ci/test_shards.py "$@"; }
          inventory="$runtime/test-list.txt"
          shard_args=(--inventory "$inventory" --os "$MATRIX_OS" --shard "$SHARD" --shards "$SHARDS")
          summary="$RUNNER_TEMP/shard-summary"
          mkdir -p "$summary"
          kaitokit_bundle="$PWD/$(cat "$runtime/KaitoKitTests-bundle.txt")"
          if [ "$SHARD" = all ]; then
            run_tests kaitokit "$kaitokit_bundle"
          else
            selector="$(plan select "${shard_args[@]}" --module KaitoKitTests)"
            run_tests kaitokit "$kaitokit_bundle" -XCTest "$selector"
          fi
          # checkout 内の build 済み tool の欠落による skip は artifact の不備として失敗にする(全 shard)。
          if grep -F "required fixture tool is unavailable: $(pwd -P)/.build/" "$RUNNER_TEMP/kaitokit-bundled.log"; then
            echo "error: packaged fixture tool is unavailable" >&2
            exit 1
          fi
          # 選んだ class が全て1回ずつ走り、件数が一覧と一致することを確かめる。
          plan verify "${shard_args[@]}" --module KaitoKitTests \
            --log "$RUNNER_TEMP/kaitokit-bundled.log" --output "$summary/kaitokit.json"
          # compat と LHA golden は arm64 と x86_64 の補集合(shard 2/2)で1回ずつ実行する。
          if [ "$SHARD" = all ] || [ "$SHARD" = "$SHARDS" ]; then
            run_tests compat "$PWD/$(cat "$runtime/KaitoKitCompatTests-bundle.txt")"
            plan verify --inventory "$inventory" --os "$MATRIX_OS" --shard all --shards all --module KaitoKitCompatTests \
              --log "$RUNNER_TEMP/compat-bundled.log" --output "$summary/compat.json"
            export TZ=Asia/Tokyo KAITO_REQUIRE_LHA_GOLDEN=1
            run_tests lha-golden "$kaitokit_bundle" \
              -XCTest KaitoKitTests.LHARawLayoutTests,KaitoKitTests.LHARawLayoutSPIImportTests,KaitoKitTests.LHAPublicValueGoldenTests
            grep -q 'LHA-GOLDEN Step0=31 TZ=Asia/Tokyo' "$RUNNER_TEMP/lha-golden-bundled.log"
            grep -q 'LHA-GOLDEN existing=3 TZ=Asia/Tokyo' "$RUNNER_TEMP/lha-golden-bundled.log"
          fi
      - name: Remove build checkout alias
        if: always()
        run: |
          python3 <<'PYTHON'
          import subprocess
          from pathlib import Path

          recorded = Path(".build/ci-runtime/checkout-path.txt")
          if recorded.is_file():
              workspace = Path.cwd().resolve()
              source = Path(recorded.read_text().strip())
              if source.is_absolute() and source != workspace and source.is_symlink() and source.resolve() == workspace:
                  subprocess.run(["sudo", "unlink", str(source)], check=True)
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-26-shard-summary-${{ matrix.os }}-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: ${{ runner.temp }}/shard-summary/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      # 失敗時は shard ごとの xctest log を残す。
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-26-logs-${{ matrix.os }}-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: ${{ runner.temp }}/*-bundled.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  macos-26-runtime-coverage:
    needs: [plan, macos-26-runtime]
    if: needs.plan.outputs.full == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # hang は 6 時間待たず、通常の所要時間の約2倍で失敗させる。
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-26-test-inventory
          path: ${{ runner.temp }}/inventory
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-26-shard-summary-*
          path: ${{ runner.temp }}/summaries
      # matrix の OS を必須にする。PR は arm64、検査済み main は Intel、それ以外は両 arch。
      # artifact の有無では省略せず、予定された shard の欠落・重複は既存の coverage で失敗にする。
      - env:
          RUNTIME_MATRIX: ${{ needs.plan.outputs.runtime-matrix }}
        run: |
          python3 <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "Scripts/ci")
          import test_shards

          expected_os = {row["os"] for row in json.loads(os.environ["RUNTIME_MATRIX"])["include"]}
          if not expected_os or not expected_os <= test_shards.PLAN.keys():
              raise ValueError(f"Invalid runtime coverage OS: {expected_os}")
          test_shards.PLAN = {name: test_shards.PLAN[name] for name in expected_os}
          temporary = Path(os.environ["RUNNER_TEMP"])
          test_shards.coverage(
              test_shards.load_inventory(temporary / "inventory/test-list.txt"), temporary / "summaries"
          )
          PYTHON

  # 利用側の cooViewer は、このスクリプトが作るフレームワークを組み込む。
  # swift build / swift test が緑でも、ここが壊れると利用側はビルドできない（2026-09 に実際に発生）。
  # cooViewer は自身の CI で Xcode 26 でも build するため、script の旧 module 配置の分岐は残す。
  framework:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["xcode-27"]' || '["self-hosted", "shunnag-arm64"]') }}
    # hang は 6 時間待たず、通常の所要時間の約2倍で失敗させる。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version
      - name: Build framework
        run: ./Scripts/build-framework.sh
      - name: Verify framework artifacts
        shell: bash
        run: |
          set -euo pipefail
          binary="Frameworks/KaitoKit.framework/Versions/A/KaitoKit"
          modules="Frameworks/KaitoKit.framework/Versions/A/Modules"

          if ! lipo_info="$(lipo -info "$binary")"; then
            echo "error: unable to inspect framework binary: $binary" >&2
            exit 1
          fi
          printf '%s\n' "$lipo_info"
          if ! grep -qw 'arm64' <<< "$lipo_info" ||
             ! grep -qw 'x86_64' <<< "$lipo_info"; then
            echo "error: KaitoKit must contain both arm64 and x86_64" >&2
            exit 1
          fi

          for module in KaitoKit KaitoKitCompat; do
            module_directory="$modules/$module.swiftmodule"
            if [[ ! -d "$module_directory" ]]; then
              echo "error: module directory not found: $module_directory" >&2
              exit 1
            fi
            if ! interface="$(find "$module_directory" -type f -name '*.swiftinterface' -print -quit)" ||
               [[ -z "$interface" ]]; then
              echo "error: swiftinterface not found: $module_directory" >&2
              exit 1
            fi
          done

          ls "$modules/"

  compressed-payload-mutants:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["xcode-27"]' || '["self-hosted", "shunnag-arm64"]') }}
    # hang は 6 時間待たず、通常の所要時間の約2倍で失敗させる。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install seed generator
        run: |
          set -euo pipefail
          if ! command -v 7zz >/dev/null 2>&1; then
            if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
              echo 'error: self-hosted runner に必要なツールがありません: 7zz' >&2
              exit 1
            fi
            brew install sevenzip
          fi
      - name: Check fuzz tooling
        run: |
          bash -n Scripts/build-framework.sh Scripts/fuzz/*.sh
          python3 -m py_compile Scripts/fuzz/mutate.py
      - name: Run compressed-payload sanitizer smoke
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP/"
          seed_directory="$(mktemp -d "$RUNNER_TEMP/compressed-seeds.XXXXXX")"
          trap 'rm -rf "$seed_directory"' EXIT
          Scripts/fuzz/make-compressed-seeds.sh "$seed_directory"
          Scripts/fuzz/run-mutants.sh --count 63 --timeout 5 \
            --password KaitoFuzz --require-payload-ranges "$seed_directory"

  # PR 対象の全 job が通った tree を記録する。Intel は含まず、main の重複検査だけ省く。
  record-tested-tree:
    needs: [plan, build-and-test, macos-26-runtime-coverage, framework, compressed-payload-mutants]
    if: github.event_name == 'pull_request' && needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    # hang は 6 時間待たず、通常の所要時間の約2倍で失敗させる。
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tree
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/tested-tree"
          printf 'tree %s\ncommit %s\nrun %s\n' "$tree" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/tested-tree/tested-tree.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/tested-tree/tested-tree.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true
